name: Unity Android

# Builds an installable APK of the Pong client. Needs repository secrets (see README):
#   UNITY_LICENSE (+ UNITY_EMAIL, UNITY_PASSWORD) or UNITY_SERIAL  -> Unity activation
#   QUANTUM_SDK_URL                                                -> private zip with Assets/Photon
# Without them the job reports what is missing and exits successfully instead of failing the repo.

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/unity-android.yml"]
  pull_request:
    paths: ["game/**", ".github/workflows/unity-android.yml"]
  workflow_dispatch:
  workflow_call: # used by release.yml

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.62f1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: pre
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          QUANTUM_SDK_URL: ${{ secrets.QUANTUM_SDK_URL }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ] && missing="$missing UNITY_LICENSE-or-UNITY_SERIAL"
          [ -z "$QUANTUM_SDK_URL" ] && missing="$missing QUANTUM_SDK_URL"
          if ls game/Assets/Photon >/dev/null 2>&1; then missing="${missing/ QUANTUM_SDK_URL/}"; fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity build skipped, missing secrets:$missing (see README)"
            {
              echo "### Unity Android build SKIPPED (no APK produced)"
              echo "Missing repository secrets:$missing"
              echo "Add them under Settings > Secrets and variables > Actions, then re-run. See README section 4."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.pre.outputs.ready == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch Quantum SDK
        if: steps.pre.outputs.ready == 'true'
        env:
          QUANTUM_SDK_URL: ${{ secrets.QUANTUM_SDK_URL }}
          QUANTUM_SDK_TOKEN: ${{ secrets.QUANTUM_SDK_TOKEN }}
        run: |
          if [ -d game/Assets/Photon ]; then echo "SDK already in the repository"; exit 0; fi
          auth=()
          [ -n "$QUANTUM_SDK_TOKEN" ] && auth=(-H "Authorization: Bearer $QUANTUM_SDK_TOKEN")
          curl -fsSL "${auth[@]}" "$QUANTUM_SDK_URL" -o "$RUNNER_TEMP/quantum-sdk.zip"
          unzip -q "$RUNNER_TEMP/quantum-sdk.zip" -d game
          test -d game/Assets/Photon || { echo "::error::zip must contain Assets/Photon"; exit 1; }

      - uses: actions/cache@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          path: game/Library
          key: Library-Android-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        if: steps.pre.outputs.ready == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: PongEditor.BuildScript.BuildAndroid
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          # Repository variable PONG_ALLOW_HTTP=1 lets the APK talk to a plain-http dev backend.
          customParameters: ${{ vars.PONG_ALLOW_HTTP == '1' && '-pongAllowHttp' || '' }}
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          name: PhotonPong-Android-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
