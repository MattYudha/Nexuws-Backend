name: Unity Android (self-hosted)

# Builds the APK on your own computer/server where Unity Hub is already signed in with your (free) license,
# so no license secret is needed. Manual trigger only. Runner setup: see README, "Self-hosted runner".
#
# Runner requirements: label `unity`, Unity 2022.3.62f1 with the Android Build Support module (SDK/NDK/OpenJDK),
# bash on PATH, and the environment variable UNITY_PATH pointing at the Unity editor executable, e.g.
#   Windows  C:\Program Files\Unity\Hub\Editor\2022.3.62f1\Editor\Unity.exe
#   macOS    /Applications/Unity/Hub/Editor/2022.3.62f1/Unity.app/Contents/MacOS/Unity
#   Linux    ~/Unity/Hub/Editor/2022.3.62f1/Editor/Unity

on:
  workflow_dispatch:
    inputs:
      allow_http:
        description: "Allow plain-http backend URLs in the APK (development only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: unity
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Quantum code generator output, the Quantum config assets, the Map and the scene are not committed.
      # The game code needs the generated code to compile, and the generator needs a project that compiles, so the
      # game code is moved aside for the generator run and put back afterwards.
      - name: Generate Quantum code, config assets and scene
        shell: bash
        env:
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables): the Photon Quantum 3 App ID.
          PHOTON_APP_ID: ${{ vars.PHOTON_APP_ID }}
          # Repository variable: public base URL of the backend, e.g. https://photon.ciptadusa.com (no /api suffix).
          PONG_BACKEND_URL: ${{ vars.PONG_BACKEND_URL }}
        run: |
          : "${UNITY_PATH:?set UNITY_PATH on the runner to the Unity editor executable}"
          rm -rf game/Assets/Scenes game/Assets/QuantumUser/Resources game/Assets/QuantumUser/*/Generated

          stash="$RUNNER_TEMP/pong-stash"
          rm -rf "$stash"; mkdir -p "$stash"
          restore() { cp -a "$stash/game/." game/; }
          trap restore EXIT
          for f in game/Assets/QuantumUser/Simulation/Pong/*.cs game/Assets/QuantumUser/View/Pong/*.cs game/Assets/Editor/PongSetup.cs; do
            mkdir -p "$stash/$(dirname "$f")"
            mv "$f" "$stash/$f"
            if [ -f "$f.meta" ]; then mv "$f.meta" "$stash/$f.meta"; fi
          done

          "$UNITY_PATH" -batchmode -nographics -quit -projectPath game \
            -executeMethod Quantum.Editor.QuantumCodeGenQtn.Run -logFile -
          restore
          trap - EXIT

          "$UNITY_PATH" -batchmode -nographics -quit -projectPath game \
            -executeMethod PongEditor.PongSetup.CreateQuantumScene -logFile -

      - name: Build APK
        shell: bash
        run: |
          : "${UNITY_PATH:?set UNITY_PATH on the runner to the Unity editor executable}"
          extra=()
          [ "${{ inputs.allow_http }}" = "true" ] && extra+=(-pongAllowHttp)
          "$UNITY_PATH" -batchmode -nographics -quit \
            -projectPath game \
            -buildTarget Android \
            -executeMethod PongEditor.BuildScript.BuildAndroid \
            -customBuildPath "$GITHUB_WORKSPACE/build/Android" \
            -androidVersionCode "${{ github.run_number }}" \
            "${extra[@]}" \
            -logFile -

      - uses: actions/upload-artifact@v4
        with:
          name: PhotonPong-Android-selfhosted-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
